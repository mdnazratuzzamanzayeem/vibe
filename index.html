      <h2>Introduction: A National Emergency in the Making</h2>
      <p>
        In the streets, villages, and even homes of Bangladesh in 2026, women and children live in perpetual fear. No neighbourhood feels safe. No hour of the day guarantees security. Almost daily, reports emerge of rape, gang rape, sexual assault, and murders following these violations. This is not a sporadic crisis; it is a national emergency that exposes the hollow promises of governance. The data are unambiguous and the trajectory is alarming: Bangladesh recorded 7,068 rape cases filed in 2025, up from 5,570 in 2024—a more than 27% increase—while nearly 70% of victims were girls under the age of eighteen. Sexual harassment, meanwhile, remains so widespread that 84% of women in general and 76% of female students report experiencing it in workplaces, public spaces, and higher educational institutions.
      </p>

      <p>
        These are not isolated statistics. They are the measurable symptoms of a deeply entrenched patriarchal order that subordinates women, normalises male violence, and systematically denies justice to survivors. The consequence is a cascading withdrawal of women—and the families who depend on them—from public life, public transport, tourism, and independent travel. This analysis examines how patriarchy, rape, harassment, and molestation converge in Bangladesh to create an environment in which solo female travellers are effectively deterred and families increasingly restrict their own mobility, compounding a broader crisis of safety and dignity.
      </p>

      <h2>The Patriarchal Foundation: Structural Inequality and the Culture of Impunity</h2>
      <p>
        Patriarchy in Bangladesh is not merely a set of attitudes; it is a structural system that creates and perpetuates unequal power dynamics, limiting women's access to education and employment, political participation, property ownership, and decision-making, while exposing them to discrimination and violence. The United Nations Population Fund ranks Bangladesh 131 out of 162 countries on its Gender Inequality Index, highlighting persistent gaps in health, empowerment, and labour market participation. This is a society in which women's subordinate roles are not incidental but foundational.
      </p>

      <p>
        Rights activists in Bangladesh consistently identify this patriarchal mindset as the root cause of continued violence. Kamrun Nahar, a member of the Women's Affairs Commission, has stated plainly that "the mindset of not treating women as equal human beings was one of the root causes behind the continued violence against women and girls," adding that "the prevailing culture of impunity, social attitude towards girls and women, and victim-blaming are main reasons for the menace". The pervasive patriarchy of Bangladeshi society is such that sexual abusers can enjoy political immunity, nurtured by a system that keeps women and girls trapped in a continuum of sexual and gender-based violence.
      </p>

      <p>
        The culture of impunity is not an accident; it is a product of a legal and political order that overwhelmingly prioritises the reputations and futures of perpetrators over the safety and dignity of victims. Victim-blaming is endemic. A UNDP analysis notes that patriarchal society "by itself creates a culture of impunity where perpetrators may be considered to be driven to commit acts of violence, especially sexual violence due to the behaviour, attire or conduct of the victims". This logic—which locates culpability in the victim rather than the perpetrator—is the ideological scaffolding that permits sexual violence to continue largely unchecked.
      </p>

      <p>
        The justice system compounds this impunity through abysmal conviction rates. Police statistics show that only 2.61% of women-related cases and 0.52% of child-related cases resulted in convictions in early 2025, compared with an overall criminal conviction rate of approximately 28%. A joint study by the Supreme Court of Bangladesh and BRAC found that only 3% of cases involving violence against women and children ended in conviction, while 70% resulted in acquittal. Of the 7,068 rape cases recorded in 2025, only around 3% ended with punishment, while nearly 70% resulted in acquittal. Over 150,000 cases involving women and children remain pending nationwide, with each specialised tribunal handling more than 1,500 cases, overwhelming judges and staff and rendering the statutory 180-day deadline for trial completion a dead letter. Survivors are trapped in a legal limbo that can drag on for five years or more, during which witnesses become unavailable, evidence deteriorates, and victims face pressure to withdraw complaints.
      </p>

      <p>
        This institutional failure is compounded by the fact that certain offences, such as rape and sexual abuse, are associated with shame and social stigma for the victim, which makes many survivors refrain from reporting such crimes. Even the medical-legal process can retraumatise survivors: the practice of two-finger tests, for example, is deeply embedded in patriarchal values where female sexual morality is prioritised in assessing the legitimacy of a rape claim. The result is a near-total breakdown in accountability. As one analysis concludes, "the law promises speed, but the system struggles to deliver".
      </p>

      <h2>The Rape Epidemic: Numbers Behind the Crisis</h2>
      <p>
        The scale of sexual violence in Bangladesh has escalated dramatically in recent years, and the data reveal not only a surge in incidents but a disturbing shift in who is targeted.
      </p>

      <p>
        In 2025, the country saw 786 documented cases of rape and gang rape, a staggering 52.3% increase from the previous year. Of these, 543 were girls under 18, reflecting a nearly 48% rise in child victims, while gang rapes alone accounted for 179 incidents. Police headquarters data corroborates the alarm: 7,068 rape cases filed in 2025, up from 5,570 in 2024. The trend has accelerated into 2026. Ain o Salish Kendra (ASK) reported 35 rape cases in January 2026 alone—25 single rapes and 10 gang rapes—with 13 victims aged 12 or younger. At least 23 minor girls and nine women were raped in February 2026, while 17 minor girls and 14 women were raped in January. Between January 2025 and February 2026, a total of 815 rape cases were reported, of which 366 involved minors aged 18 or less. In the first seven months of 2026 alone, 485 child rape cases were registered—a nearly 49% increase compared to the same period in 2025 and a nearly 98% increase compared to 2024.
      </p>

      <p>
        These figures represent only reported cases. Activists consistently note massive underreporting due to stigma, fear of reprisal, weak policing, and societal pressure, meaning the true numbers likely run far higher. Even as government officials claim a decrease in rape incidents in parliamentary statements, the documentation from human rights organisations and media monitoring paints a starkly different picture of a crisis spiralling beyond control.
      </p>

      <p>
        The targeting of children is perhaps the most harrowing dimension of this epidemic. In 2025, nearly 70% of all rape victims were girls under the age of eighteen. ASK recorded cases in which 48 children under the age of six had been raped in January–June 2025, compared to 14 cases in the same period in 2024; 86 cases of victims aged 7–12, compared to 40; and 94 cases of victims aged 13–18, compared to 50. The brutality extends beyond the act itself: in Narsingdi, a 15-year-old girl was abducted in front of her father and murdered on February 25, 2026, two weeks after she had been raped. When her family attempted to go to the police station after the rape, the perpetrators intercepted them and forced them to return home. A union parishad member settled the matter through social arbitration. Because the girl was still being stalked, her father decided to move her to safety—and on the way, they were intercepted, the girl abducted and killed. In a separate incident, a seven-year-old girl was found with her throat slit at Sitakunda Eco Park, having been subjected to attempted rape.
      </p>

      <p>
        These cases illustrate not only the depravity of the violence but the systemic failure to protect victims and hold perpetrators accountable. In case after case, the pattern repeats: assault, followed by pressure to settle informally, followed by further violence, and ultimately by the loss of life.
      </p>

      <h2>Harassment and Molestation: The Everyday Terror of Public Space</h2>
      <p>
        While rape represents the most extreme manifestation of patriarchal violence, it is the pervasive, quotidian nature of sexual harassment that most directly shapes women's daily lives and restricts their mobility. Sexual harassment remains widespread in Bangladesh, with 84% of women in general and 76% of female students reporting experiences in workplaces, public spaces, and educational institutions. In public transport specifically, the figures are similarly damning: a 2024 BRAC study found that nearly 79% of female commuters have experienced sexual harassment on public transport, with 60% feeling traumatised and approximately one in every six female commuters facing sexual harassment daily. A 2022 survey found that 87% of women surveyed had experienced harassment at least once, while 36% said they regularly faced sexual harassment on public transport. According to ActionAid Bangladesh, 84% of women have experienced sexual harassment on public transport at some point in their lives.
      </p>

      </p>

      </p>

      <p>
        The fear extends beyond physical spaces into the digital realm. A study on technology-facilitated sexual harassment among young-adult female students in Bangladesh found that nearly half of respondents (46.1%) reported experiencing such harassment, with the prevalence of suicidal thoughts, moderate to severe distress, stress, and anxiety ranging from 47.7% to 78.2%. Among women journalists, 60% reported verbal harassment compared with 9% of men, while online harassment was reported by 48% of women and 15% of men, and physical harassment by 24% of women and 7% of men.
      </p>

      <h2>The Deterrence Effect: How Fear Restructures Mobility and Travel</h2>
      <p>
        The cumulative effect of pervasive sexual violence and harassment is a profound restructuring of women's relationship to public space—and, by extension, of family travel decisions and the tourism sector as a whole.
      </p>

      <p>
        International travel advisories explicitly warn women against travelling alone in Bangladesh. The French Ministry for Europe and Foreign Affairs advises that from arrival in Bangladesh, it is essential, particularly for women and especially those travelling alone, to take certain precautions, strongly advising women not to go out alone in the evening and to avoid finding themselves alone with a taxi driver, for example. Italian travel advisories similarly recommend particular caution for women travelling alone or in small groups, advising against using public transport or occasional means of transport, against accompanying strangers, and against isolated areas at any hour of the day or night. The U.S. Department of State assesses that travellers should reconsider travel to Bangladesh due to crime, terrorism, civil unrest, and kidnapping, with a Crime Indicator indicating widespread violent crime and/or organized crime and limited local law enforcement capacity to respond to serious crimes.
      </p>

      <p>
        These official warnings reflect the lived reality of women in Bangladesh. The study on women's mobility and public harassment found that 60% of women were prevented from going out alone, and more than half did not go to certain places for fear. A woman in her 30s from Dhaka has likened the situation to "unseen chains of fear," describing how the constant threat of harassment and assault constrains her movement and choices. The United Nations Development Programme has noted that the kind of obstacles women face in terms of mobility and due to people's behaviour is "unimaginable," with women workers living in constant fear of losing their jobs or being silenced.
      </p>

      <p>
        For solo female travellers, the situation is particularly fraught. A female tourist who set out to travel across Bangladesh on foot was harassed in Lalmonirhat, with police arresting a local man who allegedly harassed her and attempted to outrage her modesty. In another incident, a female tourist travelling on foot in Bangladesh was harassed by a 31-year-old local resident when she sought to use a toilet at a private residence. Even at points of departure, women travelling alone face institutional harassment: immigration officials have subjected unmarried women travelling abroad to intrusive questions about their personal lives, with three young women stopped from travelling to Nepal and sent back from the airport, prompting them to move the High Court.
      </p>

      <p>
        The deterrence effect extends to families. In a particularly telling incident in Cox's Bazar, a woman visiting with her husband and eight-month-old child was raped. The district administration subsequently cancelled a separate zone for female and children tourists on Cox's Bazar sea beach—a zone that had been inaugurated only hours earlier. This episode encapsulates the contradictory impulses at work: the recognition that women and children need dedicated safe spaces, followed by the retraction of that recognition in the face of the very violence it was designed to address. For families contemplating travel within Bangladesh, the message is unambiguous: even a woman accompanied by her husband and infant is not safe.
      </p>

      <p>
        The tourism sector has begun to recognise the economic consequences of this safety deficit. A government tourism portal notes that when foreign investors see that a woman can travel alone in a country, they will think the country is quite safe and suitable for investment—implying that the converse is also true. The 2025 revision of the National Tourism Policy moves toward regulating tour operators and online travel agencies, and there are proposals for female-staffed floors and verified-safe listings for women travellers, but these remain nascent responses to a deep structural problem.
      </p>

      <h2>Conclusion: The Cost of Patriarchy</h2>
      <p>
        The combination of patriarchy as a structural system, rape as its most violent expression, and harassment as its quotidian enforcement mechanism has produced in Bangladesh a society in which women's freedom of movement is fundamentally compromised. The consequences are not confined to individual women; they ripple outward to families, communities, and the national economy. A country that cannot ensure that a child is safe walking to school, that a woman can travel to work without being molested, or that a family can visit a beach without fear of sexual assault is a country that is failing at the most basic level of governance.
      </p>

      <p>
        The data presented here—the 52.3% surge in documented rape cases, the 3% conviction rate, the 84% prevalence of sexual harassment, the 60% of women prevented from going out alone, the international travel advisories warning women against solo travel—are not discrete problems requiring discrete solutions. They are interconnected symptoms of a patriarchal order that assigns women subordinate status and then punishes them for venturing beyond it. Until that order is dismantled—through legal reform that prioritises survivor justice over perpetrator impunity, through the enforcement of existing laws, through the expansion and resourcing of specialised tribunals, through comprehensive sexuality education that challenges misogynistic norms, and through a sustained national campaign against sexual violence—the retreat of women and families from public space will continue.
      </p>

      <p>
        The challenge is immense, but the path forward is clear. As Kamrun Nahar has argued, there is a need for "a serious and effective national campaign against misogyny and violence against women to create awareness," with measures to protect women and children outlined in the government's work plan. The question is not whether Bangladesh can afford such a campaign, but whether it can afford not to. Every woman who retreats from public life, every family that cancels a trip, every tourist who chooses a different destination represents not only a loss of freedom but a loss of the social and economic vitality that depends on the full participation of half the population. Patriarchy, in this sense, is not only a curse for women; it is a curse for the nation as a whole.
      </p>
    </div>
  );
};

      <p>So here's the question worth sitting with for a second: how does something this universal end up this unspoken?</p>

      </p>

      <ul>
        <li><strong>Processor:</strong> Old dual-core chips from the Core 2 Duo era are more than a decade and a half old, lack modern power-efficiency and security features, and are no longer considered adequate for a current OS plus a browser doing real work. Even an entry-level 2026 laptop is expected to ship with a current-generation quad-core-or-better mobile chip.</li>
        <li><strong>RAM:</strong> Microsoft's official floor for Windows 11 is 4GB, but hardware guides and Microsoft's own engineers describe that as barely enough to boot, with 8GB as the practical minimum for smooth everyday use and 16GB increasingly treated as the sensible baseline for a machine expected to last several years, per HP's 2026 buying guidance and independent hardware coverage. A 4GB machine handed to a student today would struggle from day one, not just after a few years of wear.</li>
        <li><strong>Storage:</strong> A mechanical hard drive — 512GB or otherwise — is now considered the single biggest bottleneck in an otherwise decent machine; SSD storage is the baseline expectation on any laptop sold as new in 2026, because it affects boot time, app responsiveness and overall feel far more than capacity does.</li>
      </ul>

      <p>
        None of this requires an expensive machine. Genuinely usable, SSD-based, 8GB-RAM laptops exist at prices well within the range Doel itself charged for its worst-performing models in 2011 taka-adjusted terms. The risk isn't that a decent laptop is unaffordable — it's that "cheap" and "outdated" quietly get treated as the same purchasing decision, the way they were with Doel's bottom-tier models. That's exactly why the specifications need to be published before delivery, not discovered by students unboxing their prize: a processor and RAM figure on a tender document is a two-line disclosure, and it's the single fastest way to tell whether this program is a genuine tool or a repeat of a machine nobody could actually use.
      </p>

      <h2>The fair case for the program</h2>
      <p>
        It's worth stating plainly: the underlying idea isn't unreasonable, and dismissing it outright would be its own kind of unfairness. Rewarding academic merit is a normal thing for an education system to do, and putting a computer in the hands of a strong student from a low-income household can be a genuine, life-changing form of access — to research, to university applications, to the "AI era" skills the government has been publicly emphasizing since Prime Minister Tarique Rahman's inaugural address in February. A tablet or laptop is also a more modern, arguably more useful prize than the medals, certificates or cash stipends such programs have traditionally used. None of the concerns above are an argument against helping meritorious students. They're an argument for doing it with a plan.
      </p>

      <h2>What "doing it with a plan" would actually require</h2>
      <p>
        Before public money is committed, there's a fairly short list of things a transparent version of this program would need to disclose — and that journalists, opposition lawmakers, and civil-society watchdogs like Transparency International Bangladesh would be well within their normal, legitimate role to keep asking about:
      </p>

      <ul>
        <li>Procurement method — open competitive tender or single-source purchase, and from which supplier(s)</li>
        <li>Published technical specifications — not just "tablet" or "laptop," but the processor, RAM, storage type (SSD vs HDD) and build-quality standard being paid for, benchmarked against what a 2026 machine needs to actually run smoothly rather than merely boot</li>
        <li>Total budget and per-unit cost, so the public can judge value for money against comparable commercial devices</li>
        <li>Warranty and after-sales support terms, including who repairs a broken unit and for how long</li>
        <li>A stated device lifespan and a genuine end-of-life plan — ideally a manufacturer or government take-back commitment consistent with the 2021 e-waste rules, not a vague aspiration</li>
        <li>An independent quality audit at delivery, given that the last comparable domestic hardware push required a still-unresolved government inquiry into what went wrong</li>
      </ul>

      <h2>The bottom line</h2>
      <p>
        Bangladesh doesn't have to choose between rewarding its top students and avoiding another Doel. The choice the government actually faces is narrower and more boring: publish the specifications, publish the cost, and say — before the devices ship — what happens to them when they stop working. That's not a high bar, and it's also not one the country has consistently cleared before. Given that history, expecting the details up front isn't cynicism about this specific announcement. It's the ordinary due diligence a taxpayer-funded program of this size should get regardless of which party is in office.
      </p>

      <p className="text-sm italic mt-8 pt-4 border-t border-[var(--glass-border)] opacity-80">
        Sources: The Business Standard, Jagonews24, The Daily Star, an IEOM Society-published study and an Academia.edu-hosted paper on the Doel laptop project, archived Doel spec sheets from 2011 (StarTech.com.bd, Hasibul.info, and contemporaneous Bangladeshi tech blogs), ScienceDirect reviews of Bangladesh's e-waste policy, a 2026 VOICE/Association for Progressive Communications assessment reported by IndexBox, and 2026 hardware-standard guidance from HP and independent Windows 11 hardware coverage. This piece reflects publicly reported facts available as of September 3, 2026; procurement details for the SSC 2026 device program had not been published at time of writing and may change.
      </p>
    </div>
  );
};

      </p>

      <p>

      </p>
      <p>

      </p>

      <h3>Severe Financial Starvation</h3>
      <p>
        While UNESCO recommends that developing nations allocate 4% to 6% of their GDP to education, Bangladesh routinely allocates a meager 1.8%. Worse, due to budget cuts and bureaucratic implementation failures, the actual expenditure often drops to a humiliating 1.3%.
      </p>
      <p>

      </p>

      <h3>2. Shift Focus from Final Exams to Continuous Assessment</h3>
      <p>
        Relying on a single, high-stakes 3-hour exam to determine a student’s entire life path is archaic and cruel. We must transition to a continuous assessment model. Projects, presentations, critical writing, and consistent class performance should carry equal weight, teaching students how to think rather than what to memorize.
      </p>

      <h3>3. Elevate the Teacher’s Status and Training</h3>
      <p>
        A curriculum is only as good as the person delivering it. We must depoliticize school management committees and establish an independent, permanent Education Commission. Teachers must receive rigorous, continuous training. Most importantly, teaching must be made a financially rewarding career path to attract top-tier university graduates.
      </p>

      <h3>4. Realignment of the Academic Calendar</h3>
      <p>
        Our current academic schedule is plagued by wasted "dead time" caused by administrative delays, overlapping exam sessions, and sudden political or climate disruptions. Restructuring the academic calendar to run on a tight, predictable schedule can reclaim up to a year of lost time for our youth, reducing national stress and boosting learning hours.

const ContactForm: React.FC = () => {
  const [formData, setFormData] = useState({
    name: '',
    email: '',
    message: '',
    botcheck: ''
  });
  const [status, setStatus] = useState<'idle' | 'submitting' | 'success' | 'error'>('idle');
  const [feedbackMsg, setFeedbackMsg] = useState('');

  const handleChange = (e: React.ChangeEvent<HTMLInputElement | HTMLTextAreaElement>) => {
    setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));
  };

  const handleSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    if (formData.botcheck) return; // honeypot
    
    setStatus('submitting');
    setFeedbackMsg('');

    try {
      const response = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({
          access_key: '20c41191-09b3-4c3e-b1c5-ef157eb38720',
          subject: 'New message from Alter Contact Form',
          name: formData.name,
          email: formData.email,
          message: formData.message
        })
      });

      const result = await response.json();
      if (response.status === 200 || result.success) {
        setStatus('success');
        setFeedbackMsg('Thank you. Your message has been received.');
        setFormData({ name: '', email: '', message: '', botcheck: '' });
        setTimeout(() => {
          setStatus('idle');
          setFeedbackMsg('');
        }, 5000);
      } else {
        setStatus('error');
        setFeedbackMsg(result.message || 'Failed to submit. Please try again.');
        setTimeout(() => setStatus('idle'), 4000);
      }
    } catch {
      setStatus('error');
      setFeedbackMsg('Network error. Please check your connection and try again.');
      setTimeout(() => setStatus('idle'), 4000);
    }
  };

  return (
    <form onSubmit={handleSubmit} className="flex flex-col gap-6 max-w-xl mx-auto items-center w-full">
      <input
        type="checkbox"
        name="botcheck"
        className="hidden"
        style={{ display: 'none' }}
        checked={!!formData.botcheck}
        onChange={e => setFormData(p => ({ ...p, botcheck: e.target.checked ? 'bot' : '' }))}
      />

      <div className="flex flex-col gap-2 w-full text-center">
        <label htmlFor="contact-name" className="text-sm font-medium text-[var(--text-main)]">
          Full Name
        </label>
        <input
          id="contact-name"
          type="text"
          name="name"
          value={formData.name}
          onChange={handleChange}
          required
          placeholder="Jane Doe"
          className="w-full p-4 rounded-2xl bg-[var(--input-bg)] border border-[var(--input-border)] text-[var(--text-main)] placeholder-[var(--text-light)] focus:bg-[var(--input-focus)] focus:border-[var(--input-focus-border)] focus:outline-none focus:ring-4 focus:ring-black/5 dark:focus:ring-white/10 transition-all text-center text-base"
        />
      </div>

      <div className="flex flex-col gap-2 w-full text-center">
        <label htmlFor="contact-email" className="text-sm font-medium text-[var(--text-main)]">
          Email Address
        </label>
        <input
          id="contact-email"
          type="email"
          name="email"
          value={formData.email}
          onChange={handleChange}
          required
          placeholder="jane@example.com"
          className="w-full p-4 rounded-2xl bg-[var(--input-bg)] border border-[var(--input-border)] text-[var(--text-main)] placeholder-[var(--text-light)] focus:bg-[var(--input-focus)] focus:border-[var(--input-focus-border)] focus:outline-none focus:ring-4 focus:ring-black/5 dark:focus:ring-white/10 transition-all text-center text-base"
        />
      </div>

      <div className="flex flex-col gap-2 w-full text-center">
        <label htmlFor="contact-message" className="text-sm font-medium text-[var(--text-main)]">
          Message
        </label>
        <textarea
          id="contact-message"
          name="message"
          rows={5}
          value={formData.message}
          onChange={handleChange}
          required
          placeholder="How can we help you?"
          className="w-full p-4 rounded-2xl bg-[var(--input-bg)] border border-[var(--input-border)] text-[var(--text-main)] placeholder-[var(--text-light)] focus:bg-[var(--input-focus)] focus:border-[var(--input-focus-border)] focus:outline-none focus:ring-4 focus:ring-black/5 dark:focus:ring-white/10 transition-all text-center text-base resize-y"
        />
      </div>

      {feedbackMsg && (
        <div
          className={`flex items-center gap-2 px-4 py-2.5 rounded-full text-sm font-medium ${
            status === 'success'
              ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30'
              : 'bg-rose-500/15 text-rose-600 dark:text-rose-400 border border-rose-500/30'
          }`}
        >
          {status === 'success' ? <CheckCircle2 className="w-4 h-4" /> : <AlertCircle className="w-4 h-4" />}
          <span>{feedbackMsg}</span>
        </div>
      )}

      <button
        type="submit"
        disabled={status === 'submitting'}
        className={`inline-flex items-center justify-center gap-3 px-8 py-3.5 rounded-full font-medium text-base transition-all duration-300 shadow-md ${
          status === 'submitting'
            ? 'opacity-70 cursor-not-allowed bg-[var(--btn-bg)] text-[var(--btn-text)]'
            : status === 'success'
            ? 'bg-emerald-600 text-white'
            : 'bg-[var(--btn-bg)] text-[var(--btn-text)] hover:bg-[var(--btn-hover)] hover:-translate-y-0.5 hover:shadow-xl cursor-pointer'
        }`}
      >
        {status === 'submitting' ? (
          <>
            <span>Sending...</span>
            <Loader2 className="w-5 h-5 animate-spin" />
          </>
        ) : status === 'success' ? (
          <>
            <span>Message Sent</span>
            <CheckCircle2 className="w-5 h-5" />
          </>
        ) : (
          <>
            <span>Send Message</span>
            <Send className="w-4 h-4" />
          </>
        )}
      </button>
    </form>
  );
};

interface BottomNavProps {
  currentView: string;
  onSelectView: (view: string) => void;
  theme: 'light' | 'dark';
  onToggleTheme: () => void;
}

const BottomNav: React.FC<BottomNavProps> = ({
  currentView,
  onSelectView,
  theme,
  onToggleTheme
}) => {
  const [opacity, setOpacity] = useState(1);
  const idleTimerRef = useRef<NodeJS.Timeout | null>(null);
  const isHoveredRef = useRef(false);

  useEffect(() => {
    const resetIdleTimer = () => {
      setOpacity(1);
      if (idleTimerRef.current) clearTimeout(idleTimerRef.current);

      idleTimerRef.current = setTimeout(() => {
        if (!isHoveredRef.current) {
          setOpacity(0.4);
        }
      }, 3500);
    };

    const events = ['mousemove', 'scroll', 'touchstart', 'click', 'keydown'];
    events.forEach(event => window.addEventListener(event, resetIdleTimer, { passive: true }));
    resetIdleTimer();

    return () => {
      if (idleTimerRef.current) clearTimeout(idleTimerRef.current);
      events.forEach(event => window.removeEventListener(event, resetIdleTimer));
    };
  }, []);

  const handleMouseEnter = () => {
    isHoveredRef.current = true;
    setOpacity(1);
    if (idleTimerRef.current) clearTimeout(idleTimerRef.current);
  };

  const handleMouseLeave = () => {
    isHoveredRef.current = false;
    idleTimerRef.current = setTimeout(() => {
      setOpacity(0.4);
    }, 3000);
  };

  // If viewing an article, highlight 'blogs' (Journal)
  const isJournalActive = currentView === 'blogs' || currentView.startsWith('post-');

  return (
    <nav
      onMouseEnter={handleMouseEnter}
      onMouseLeave={handleMouseLeave}
      style={{ opacity }}
      className="fixed bottom-5 sm:bottom-6 left-1/2 -translate-x-1/2 flex items-center justify-between sm:justify-center gap-1 sm:gap-2 px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-full z-40 transition-all duration-500 ease-out shadow-2xl glass-panel w-auto max-w-[92vw] sm:max-w-max border border-[var(--glass-border)] bg-[var(--glass-bg)] backdrop-blur-xl select-none"
      aria-label="Main Navigation"
    >
      <button
        onClick={() => onSelectView('home')}
        className={`flex flex-col items-center justify-center gap-0.5 sm:gap-1 px-3 sm:px-4 py-1.5 rounded-full transition-all duration-300 cursor-pointer min-h-[42px] touch-manipulation ${
          currentView === 'home'
            ? 'text-[var(--text-main)] bg-[var(--glass-active)] shadow-inner'
            : 'text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--glass-hover)] active:scale-95'
        }`}
        aria-label="Home"
      >
        <Home className="w-5 h-5 transition-transform duration-300 group-hover:-translate-y-0.5" />
        <span className="text-[11px] font-semibold tracking-wide">Home</span>
      </button>

      <button
        onClick={() => onSelectView('blogs')}
        className={`flex flex-col items-center justify-center gap-0.5 sm:gap-1 px-3 sm:px-4 py-1.5 rounded-full transition-all duration-300 cursor-pointer min-h-[42px] touch-manipulation ${
          isJournalActive
            ? 'text-[var(--text-main)] bg-[var(--glass-active)] shadow-inner'
            : 'text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--glass-hover)] active:scale-95'
        }`}
        aria-label="Journal"
      >
        <BookOpen className="w-5 h-5 transition-transform duration-300 group-hover:-translate-y-0.5" />
        <span className="text-[11px] font-semibold tracking-wide">Journal</span>
      </button>

      <button
        onClick={() => onSelectView('about')}
        className={`flex flex-col items-center justify-center gap-0.5 sm:gap-1 px-3 sm:px-4 py-1.5 rounded-full transition-all duration-300 cursor-pointer min-h-[42px] touch-manipulation ${
          currentView === 'about'
            ? 'text-[var(--text-main)] bg-[var(--glass-active)] shadow-inner'
            : 'text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--glass-hover)] active:scale-95'
        }`}
        aria-label="About"
      >
        <User className="w-5 h-5 transition-transform duration-300 group-hover:-translate-y-0.5" />
        <span className="text-[11px] font-semibold tracking-wide">About</span>
      </button>

      <button
        onClick={() => onSelectView('contact')}
        className={`flex flex-col items-center justify-center gap-0.5 sm:gap-1 px-3 sm:px-4 py-1.5 rounded-full transition-all duration-300 cursor-pointer min-h-[42px] touch-manipulation ${
          currentView === 'contact'
            ? 'text-[var(--text-main)] bg-[var(--glass-active)] shadow-inner'
            : 'text-[var(--text-muted)] hover:text-[var(--text-main)] hover:bg-[var(--glass-hover)] active:scale-95'
        }`}
        aria-label="Contact"
      >
        <Mail className="w-5 h-5 transition-transform duration-300 group-hover:-translate-y-0.5" />

interface ArticleViewProps {
  articleId: string;
  onBack: () => void;
  onNavigateArticle: (id: string) => void;
}

const ArticleView: React.FC<ArticleViewProps> = ({
  articleId,
  onBack,
  onNavigateArticle
}) => {
  const [copied, setCopied] = useState(false);
  const [fontSizeClass, setFontSizeClass] = useState<'text-base' | 'text-lg' | 'text-xl'>('text-base');
  const [scrollProgress, setScrollProgress] = useState(0);

  const article = ARTICLES.find(a => a.id === articleId) || ARTICLES[0];
  const currentIndex = ARTICLES.findIndex(a => a.id === article.id);
  const nextArticle = currentIndex < ARTICLES.length - 1 ? ARTICLES[currentIndex + 1] : ARTICLES[0];
  const prevArticle = currentIndex > 0 ? ARTICLES[currentIndex - 1] : null;

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'smooth' });

    const handleScroll = () => {
      const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
      if (totalHeight > 0) {
        const progress = (window.scrollY / totalHeight) * 100;
        setScrollProgress(Math.min(100, Math.max(0, progress)));
      }
    };
    window.addEventListener('scroll', handleScroll, { passive: true });
    return () => window.removeEventListener('scroll', handleScroll);
  }, [articleId]);

  const handleShare = async () => {
    if (navigator.share) {
      try {
        await navigator.share({
          title: article.title,
          text: article.subtitle,
          url: window.location.href
        });
        return;
      } catch {
        // Fallback to clipboard
      }
    }
    navigator.clipboard?.writeText(window.location.href);
    setCopied(true);
    setTimeout(() => setCopied(false), 2500);
  };

  const renderContent = () => {
    switch (article.id) {
      case 'post-movement':
        return <ArticlePostMovement />;
      case 'post-period':
        return <ArticlePostPeriod />;
      case 'post-tabs':
        return <ArticlePostTabs />;
      case 'post-collapse':
        return <ArticlePostCollapse />;
      default:
        return <ArticlePostMovement />;
    }
  };

  return (
    <div className="w-full">
      {/* Reading Progress Indicator */}
      <div
        className="fixed top-0 left-0 h-1 bg-[var(--text-main)] z-50 transition-all duration-150"
        style={{ width: `${scrollProgress}%` }}
        role="progressbar"
        aria-valuenow={Math.round(scrollProgress)}
      />

      {/* Top Header Actions */}
      <div className="flex flex-wrap items-center justify-between gap-4 mb-8">
        <button
          onClick={onBack}
          className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-[var(--glass-bg)] border border-[var(--glass-border)] text-[var(--text-main)] hover:bg-[var(--glass-hover)] transition-all shadow-sm cursor-pointer hover:-translate-x-1"
        >
          <ArrowLeft className="w-4 h-4" />
          <span className="font-medium text-sm">Back</span>
        </button>

        <div className="flex items-center gap-2">
          {/* Font Size Adjusters */}
          <div className="inline-flex items-center bg-[var(--glass-bg)] border border-[var(--glass-border)] rounded-full p-1 text-xs text-[var(--text-muted)]">
            <button
              onClick={() => setFontSizeClass('text-base')}
              className={`px-2.5 py-1 rounded-full transition-colors cursor-pointer ${
                fontSizeClass === 'text-base'
                  ? 'bg-[var(--text-main)] text-[var(--bg-color)] font-semibold'
                  : 'hover:text-[var(--text-main)]'
              }`}
              title="Standard font size"
            >
              A
            </button>
            <button
              onClick={() => setFontSizeClass('text-lg')}
              className={`px-2.5 py-1 rounded-full transition-colors cursor-pointer text-sm ${
                fontSizeClass === 'text-lg'
                  ? 'bg-[var(--text-main)] text-[var(--bg-color)] font-semibold'
                  : 'hover:text-[var(--text-main)]'
              }`}
              title="Larger font size"
            >
              A+
            </button>
            <button
              onClick={() => setFontSizeClass('text-xl')}
              className={`px-2.5 py-1 rounded-full transition-colors cursor-pointer text-base font-bold ${
                fontSizeClass === 'text-xl'
                  ? 'bg-[var(--text-main)] text-[var(--bg-color)] font-semibold'
                  : 'hover:text-[var(--text-main)]'
              }`}
              title="Largest font size"
            >
              A++
            </button>
          </div>

          {/* Share Button */}
          <button
            onClick={handleShare}
            className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[var(--glass-bg)] border border-[var(--glass-border)] text-[var(--text-main)] hover:bg-[var(--glass-hover)] transition-all text-xs font-medium cursor-pointer"
            title="Share this essay"
          >
            {copied ? (
              <>
                <Check className="w-3.5 h-3.5 text-emerald-500" />
                <span className="text-emerald-600 dark:text-emerald-400">Copied</span>
              </>
            ) : (
              <>
                <Share2 className="w-3.5 h-3.5" />
                <span>Share</span>
              </>
            )}
          </button>
        </div>
      </div>

      {/* Main Title & Editorial Metadata */}
      <header className="max-w-4xl mx-auto text-center mb-10">
        <div className="inline-block px-3.5 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-[var(--text-main)] text-[var(--bg-color)] mb-4">
          {article.tag}
        </div>
        <h1 className="font-heading text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold tracking-tight text-[var(--text-main)] leading-tight mb-4">
          {article.title}
        </h1>
        <div className="flex items-center justify-center gap-4 text-xs sm:text-sm text-[var(--text-light)] mb-6">
          <span className="inline-flex items-center gap-1.5">
            <Calendar className="w-3.5 h-3.5" />
            {article.date}
          </span>
          <span>•</span>
          <span className="inline-flex items-center gap-1.5">
            <Clock className="w-3.5 h-3.5" />
            {article.readTime}
          </span>
        </div>
        <p className="text-lg sm:text-xl text-[var(--text-muted)] font-light leading-relaxed max-w-3xl mx-auto italic border-l-2 sm:border-l-0 sm:border-y border-[var(--glass-border)] py-4 px-4 sm:px-0">
          {article.subtitle}
        </p>
      </header>

      {/* Article Body */}
      <article className={`max-w-3xl mx-auto ${fontSizeClass}`}>
        {renderContent()}
      </article>

      {/* Article Footer & Next Article Link */}
      <div className="max-w-3xl mx-auto mt-16 pt-10 border-t border-[var(--glass-border)] flex flex-col sm:flex-row items-center justify-between gap-6">
        {prevArticle ? (
          <button
            onClick={() => onNavigateArticle(prevArticle.id)}
            className="flex flex-col items-start gap-1 p-4 rounded-2xl bg-[var(--glass-bg)] border border-[var(--glass-border)] hover:bg-[var(--glass-hover)] transition-all cursor-pointer w-full sm:w-1/2 text-left"
          >
            <span className="text-xs uppercase tracking-wider text-[var(--text-light)] flex items-center gap-1">
              <ArrowLeft className="w-3 h-3" /> Previous Essay
            </span>
            <span className="font-heading font-bold text-sm sm:text-base text-[var(--text-main)] line-clamp-1">
              {prevArticle.shortTitle}
            </span>
          </button>
        ) : (
          <div className="hidden sm:block sm:w-1/2" />
        )}

        {nextArticle && nextArticle.id !== article.id && (
          <button
            onClick={() => onNavigateArticle(nextArticle.id)}
            className="flex flex-col items-end gap-1 p-4 rounded-2xl bg-[var(--glass-bg)] border border-[var(--glass-border)] hover:bg-[var(--glass-hover)] transition-all cursor-pointer w-full sm:w-1/2 text-right"
          >
            <span className="text-xs uppercase tracking-wider text-[var(--text-light)] flex items-center gap-1">
              Next Essay <ArrowRight className="w-3 h-3" />
            </span>
            <span className="font-heading font-bold text-sm sm:text-base text-[var(--text-main)] line-clamp-1">
              {nextArticle.shortTitle}
            </span>
          </button>
        )}
      </div>
    </div>
  );
};

    if (typeof window !== 'undefined') {
      const saved = localStorage.getItem('alter-theme');
      if (saved === 'light' || saved === 'dark') return saved;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return 'light';
  });

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('alter-theme', theme);

  // Sync hash routing if user comes with a direct link (e.g. #post-period)
  useEffect(() => {

    window.addEventListener('hashchange', handleHash);
    return () => window.removeEventListener('hashchange', handleHash);

                Any information submitted through our contact forms is used solely for the purpose of responding to your inquiry. We will never sell, rent, or distribute your email address to third parties.
              </p>

              <h2>3. Local Storage</h2>
              <p>
                We use local browser storage to save your reading preferences (such as your Light/Dark theme settings) to ensure a consistent experience across sessions. This data never leaves your device.
              </p>
            </div>
          </section>
        )}

        {/* ================= TERMS VIEW ================= */}
        {currentView === 'terms' && (
          <section className="animate-in fade-in duration-500 max-w-3xl mx-auto">
            <h1 className="font-heading text-4xl sm:text-5xl font-bold text-[var(--text-main)] text-center mb-2">
              Terms of Service
            </h1>
            <p className="text-sm text-[var(--text-light)] text-center mb-10">Please read these terms carefully before using Alter.</p>

            <div className="editorial-prose">

              <p>
                By accessing and using Alter, you accept and agree to be bound by the terms and provision of this agreement. If you do not agree to abide by these terms, please do not use this service.
              </p>

              <h2>2. Intellectual Property</h2>
              <p>
                All content published on Alter, including text, typography choices, layout design, and code structure, is the property of Alter Studio. You may not reproduce, distribute, or create derivative works without explicit permission.
              </p>

              <h2>3. User Conduct</h2>
              <p>
                Users agree to use the site for lawful purposes only. Any attempt to compromise the security of the site, bypass navigation structures, or scrape content automatically is strictly prohibited.
              </p>
            </div>
          </section>
        )}

        {/* Subtle Editorial Footer */}
        <footer className="mt-24 pt-8 border-t border-[var(--glass-border)] text-center text-xs text-[var(--text-light)] flex flex-col sm:flex-row items-center justify-between gap-4">
          <p>© 2026 Alter. Dispatches and essays on education, society, and culture.</p>
          <div className="flex items-center gap-4">
            <button
              onClick={() => openView('privacy')}
              className="hover:text-[var(--text-main)] transition-colors cursor-pointer"
            >
              Privacy Policy
            </button>
            <span>•</span>
            <button
              onClick={() => openView('terms')}
              className="hover:text-[var(--text-main)] transition-colors cursor-pointer"
            >
              Terms of Service
            </button>
          </div>
        </footer>
      </main>

      {/* Floating Bottom Navigation (Optimized for mobile) */}
      <BottomNav
        currentView={currentView}
        onSelectView={openView}
        theme={theme}
        onToggleTheme={toggleTheme}
      />
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
